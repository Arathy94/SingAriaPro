<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SingAria Pro – Tests</title>
<style>
:root {
    --bg: #f9f9f6; --surface: #fff; --surface-hover: #f0efeb;
    --border: #e0ded8; --text: #1c1c22; --text-dim: #6e6e7a;
    --primary: #c8930a; --primary-hover: #a67a08;
    --primary-bg: rgba(200,147,10,0.08); --waveform: #3b7dd8;
    --selection: rgba(200,147,10,0.3); --playhead: #c8930a;
    --danger: #c0392b; --radius: 8px; --radius-lg: 12px;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
}
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; }
.app { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
#upload-screen { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
.drop-zone { width: 100%; padding: 56px 32px; border: 2px dashed var(--border); border-radius: var(--radius-lg); text-align: center; cursor: pointer; }
.drop-zone > * { pointer-events: none; }
.drop-zone h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.drop-zone p { font-size: 14px; color: var(--text-dim); }
.drop-icon { font-size: 48px; margin-bottom: 16px; color: var(--primary); }
.waveform-container { position: relative; width: 100%; height: 128px; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.waveform-container canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.time-row { display: flex; justify-content: space-between; padding: 6px 2px; font-size: 13px; color: var(--text-dim); }
.controls-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
.btn { padding: 8px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--text); cursor: pointer; padding: 0; flex-shrink: 0; }
.btn-icon.active { background: var(--primary-bg); border-color: var(--primary); color: var(--primary); }
.btn-icon.primary-fill { background: var(--primary); color: var(--bg); border-color: var(--primary); }
.btn-icon svg { display: block; }
.btn-sm { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer; }
.btn-sm.active { background: var(--primary-bg); border-color: var(--primary); color: var(--primary); }
.btn-sm.danger { color: var(--danger); }
.loop-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
.loop-info { font-size: 12px; color: var(--text-dim); flex: 1; }
.slider-section { padding: 16px 0 8px; display: flex; flex-direction: column; gap: 14px; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row label { width: 44px; font-size: 13px; font-weight: 500; color: var(--text-dim); flex-shrink: 0; }
.slider-row input[type="range"] { flex: 1; height: 4px; }
.slider-val { width: 52px; text-align: right; font-size: 13px; color: var(--text); font-weight: 500; flex-shrink: 0; }
.btn-reset { padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-dim); font-size: 11px; cursor: pointer; flex-shrink: 0; }
.lyrics-section { padding: 16px 0; }
.lyrics-section label { display: block; font-size: 13px; font-weight: 500; color: var(--text-dim); margin-bottom: 8px; }
.lyrics-section textarea { width: 100%; min-height: 180px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 14px; line-height: 1.7; resize: vertical; white-space: pre-wrap; overflow-wrap: break-word; box-sizing: border-box; }
.error-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 10px 24px; background: var(--danger); color: #fff; border-radius: var(--radius); font-size: 14px; z-index: 100; }
.btn-text { background: none; border: none; color: var(--primary); font-size: 13px; cursor: pointer; padding: 0; }
.shortcuts-hint { text-align: center; font-size: 12px; color: var(--text-dim); padding: 12px 0 0; opacity: 0.7; }

/* Test panel */
#test-panel { position: fixed; top: 0; right: 0; width: 400px; height: 100vh; overflow-y: auto; background: #1a1a2e; color: #eee; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; z-index: 99999; box-shadow: -2px 0 12px rgba(0,0,0,0.5); box-sizing: border-box; }
#test-panel h1 { font-size: 1.2em; margin: 0 0 8px; }
.ts { margin-bottom: 10px; font-size: 1em; }
.p { color: #2ecc71; } .f { color: #e74c3c; }
.grp { margin: 10px 0 2px; font-weight: 600; color: #aaa; }
.tl { padding: 1px 0 1px 12px; }
.tl.f { background: rgba(231,76,60,0.1); }
.err { padding-left: 24px; color: #e74c3c; font-size: 0.85em; white-space: pre-wrap; }
</style>
</head>
<body>

<!-- App HTML (same as index.html) -->
<div class="app">
    <div id="upload-screen">
        <div class="drop-zone" id="drop-zone">
            <div class="drop-icon">&#9835;</div>
            <h2>Drop an audio file here</h2>
            <p>or click to browse</p>
            <p class="formats">MP3, WAV, OGG, FLAC, M4A, AAC</p>
        </div>
        <input type="file" id="file-input" accept="audio/*" hidden>
    </div>
    <div id="player-screen" hidden>
        <header class="header">
            <h1>SingAria Pro</h1>
            <div class="file-info">
                <span class="file-name" id="file-name"></span>
                <button class="btn-text" id="change-btn">Change song</button>
            </div>
        </header>
        <section class="waveform-section">
            <div class="waveform-container" id="waveform-container">
                <canvas id="waveform-canvas"></canvas>
                <canvas id="overlay-canvas"></canvas>
            </div>
            <div class="zoom-scrollbar" id="zoom-scrollbar" style="display:none;position:relative;width:100%;height:24px;margin-top:4px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);">
                <canvas id="scrollbar-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
            </div>
            <div class="time-row">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </section>
        <div class="controls-row">
            <button class="btn-icon primary-fill" id="play-btn" aria-label="Play"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><polygon points="4,2 16,9 4,16"/></svg></button>
            <button class="btn-icon" id="loop-btn" aria-label="Loop"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3l2 2-2 2"/><path d="M3 9V7a2 2 0 012-2h10"/><path d="M5 15l-2-2 2-2"/><path d="M15 9v2a2 2 0 01-2 2H3"/></svg></button>
        </div>
        <div class="loop-row">
            <button class="btn-sm" id="set-a-btn">Set A</button>
            <button class="btn-sm" id="set-b-btn">Set B</button>
            <span class="loop-info" id="loop-info"></span>
            <button class="btn-sm danger" id="clear-loop-btn">Clear</button>
        </div>
        <div class="slider-section">
            <div class="slider-row">
                <label for="speed-slider">Speed</label>
                <input type="range" id="speed-slider" min="0.25" max="2" step="0.05" value="1">
                <span class="slider-val" id="speed-val">1.00x</span>
                <button class="btn-reset" id="speed-reset">Reset</button>
            </div>
            <div class="slider-row">
                <label for="pitch-slider">Pitch</label>
                <input type="range" id="pitch-slider" min="-12" max="12" step="1" value="0">
                <span class="slider-val" id="pitch-val">0 st</span>
                <button class="btn-reset" id="pitch-reset">Reset</button>
            </div>
        </div>
        <div class="lyrics-section">
            <label for="lyrics-area">Lyrics</label>
            <textarea id="lyrics-area" placeholder="Type or paste lyrics here."></textarea>
        </div>
        <div class="shortcuts-hint">Space: play / stop &middot; Esc: stop</div>
    </div>
</div>
<div id="error-toast" class="error-toast" hidden></div>

<!-- Test results panel -->
<div id="test-panel">
    <h1>SingAria Pro Tests</h1>
    <div class="ts" id="summary">Running...</div>
    <div id="results"></div>
</div>

<!-- Mock Tone.js -->
<script>
var _fakeTime = 100;
window.Tone = {
    now: function () { return _fakeTime; },
    start: function () { return Promise.resolve(); },
    ToneAudioBuffer: function () {},
    Player: function () {
        return {
            playbackRate: 1, loop: false,
            start: function () {}, stop: function () {}, dispose: function () {},
            connect: function () { return this; },
            toDestination: function () { return this; }
        };
    },
    PitchShift: function () {
        return {
            pitch: 0, windowSize: 0.1,
            dispose: function () {},
            connect: function () { return this; },
            toDestination: function () { return this; }
        };
    }
};
window.__SINGARIA_TEST__ = true;
</script>

<!-- App JS (same IIFE as index.html) -->
<script>
(function () {
    var state = {
        player: null, pitchShift: null, objectUrl: null, duration: 0, isPlaying: false,
        currentPosition: 0, playStartTime: 0, playStartOffset: 0,
        speed: 1, pitch: 0, loopEnabled: false, loopStart: null,
        loopEnd: null, fileName: '', waveformData: null,
        dragging: false, animFrame: null, loopTimer: null,
        zoom: 1, viewStart: 0, viewEnd: 0
    };

    var $ = function (id) { return document.getElementById(id); };
    var el = {
        uploadScreen: $('upload-screen'), playerScreen: $('player-screen'),
        dropZone: $('drop-zone'), fileInput: $('file-input'),
        wfCanvas: $('waveform-canvas'), olCanvas: $('overlay-canvas'),
        sbCanvas: $('scrollbar-canvas'), zoomScrollbar: $('zoom-scrollbar'),
        wfContainer: $('waveform-container'), curTime: $('current-time'),
        totTime: $('total-time'), playBtn: $('play-btn'),
        loopBtn: $('loop-btn'), setA: $('set-a-btn'), setB: $('set-b-btn'),
        loopInfo: $('loop-info'), clearLoop: $('clear-loop-btn'),
        speedSlider: $('speed-slider'), speedVal: $('speed-val'),
        speedReset: $('speed-reset'), pitchSlider: $('pitch-slider'),
        pitchVal: $('pitch-val'), pitchReset: $('pitch-reset'),
        lyrics: $('lyrics-area'), fileName: $('file-name'),
        changeBtn: $('change-btn'), errorToast: $('error-toast')
    };

    var ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><polygon points="4,2 16,9 4,16"/></svg>';
    var ICON_STOP = '<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="3" y="3" width="12" height="12" rx="1"/></svg>';

    function fmt(s) {
        if (!isFinite(s) || s < 0) return '0:00';
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
    }
    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
    function showError(msg) { el.errorToast.textContent = msg; el.errorToast.hidden = false; setTimeout(function () { el.errorToast.hidden = true; }, 3500); }

    var DB_NAME = 'SingAriaProDB';
    var DB_VERSION = 1;
    var STORE_NAME = 'audio';
    var AUDIO_KEY = 'currentSong';

    function openDB() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function () { req.result.createObjectStore(STORE_NAME); };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error); };
        });
    }

    function saveAudioToDB(blob, fileName) {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put({ blob: blob, fileName: fileName }, AUDIO_KEY);
                tx.oncomplete = function () { db.close(); resolve(); };
                tx.onerror = function () { db.close(); reject(tx.error); };
            });
        });
    }

    function getSavedAudio() {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var req = tx.objectStore(STORE_NAME).get(AUDIO_KEY);
                req.onsuccess = function () { db.close(); resolve(req.result || null); };
                req.onerror = function () { db.close(); reject(req.error); };
            });
        });
    }

    function clearSavedAudio() {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(AUDIO_KEY);
                tx.oncomplete = function () { db.close(); resolve(); };
                tx.onerror = function () { db.close(); reject(tx.error); };
            });
        });
    }

    function setView(start, end) {
        var span = end - start;
        if (span < 0.1) { span = 0.1; end = start + span; }
        if (start < 0) { start = 0; end = span; }
        if (end > state.duration) { end = state.duration; start = Math.max(0, end - span); }
        state.viewStart = start; state.viewEnd = end;
        state.zoom = state.duration / (end - start);
    }
    function zoomAt(centerTime, factor) {
        var span = state.viewEnd - state.viewStart;
        var newSpan = clamp(span / factor, 0.1, state.duration);
        var ratio = (centerTime - state.viewStart) / span;
        var newStart = centerTime - ratio * newSpan;
        setView(newStart, newStart + newSpan);
        drawWaveform(); drawOverlay();
    }
    function ensureVisible(t) {
        var span = state.viewEnd - state.viewStart;
        var margin = span * 0.1;
        if (t < state.viewStart + margin) { setView(t - margin, t - margin + span); drawWaveform(); }
        else if (t > state.viewEnd - margin) { setView(t + margin - span, t + margin); drawWaveform(); }
    }
    function timeToX(t, w) {
        var span = state.viewEnd - state.viewStart;
        if (span <= 0) return 0;
        return ((t - state.viewStart) / span) * w;
    }

    function getPos() {
        if (!state.isPlaying) return state.currentPosition;
        var elapsed = (Tone.now() - state.playStartTime) * state.speed;
        var pos = state.playStartOffset + elapsed;
        if (state.loopEnabled && state.loopStart !== null && state.loopEnd !== null) {
            var len = state.loopEnd - state.loopStart;
            if (len > 0 && pos > state.loopEnd) {
                pos = state.loopStart + ((pos - state.loopStart) % len);
            }
        }
        return clamp(pos, 0, state.duration);
    }

    function updateSliderFill(slider) {
        var pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
        var s = getComputedStyle(document.documentElement);
        var pri = s.getPropertyValue('--primary').trim();
        var brd = s.getPropertyValue('--border').trim();
        slider.style.background = 'linear-gradient(to right,' + pri + ' ' + pct + '%,' + brd + ' ' + pct + '%)';
    }

    function showPlayer() { el.uploadScreen.hidden = true; el.playerScreen.hidden = false; resetDropZone(); resizeCanvases(); }
    function resetDropZone() {
        el.dropZone.innerHTML = '<div class="drop-icon">&#9835;</div><h2>Drop an audio file here</h2><p>or click to browse</p><p class="formats">MP3, WAV, OGG, FLAC, M4A, AAC</p>';
    }
    function showUpload() { if (state.isPlaying) doStop(); el.uploadScreen.hidden = false; el.playerScreen.hidden = true; resetDropZone(); }
    function resizeCanvases() {
        var rect = el.wfContainer.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        [el.wfCanvas, el.olCanvas].forEach(function (c) { c.width = rect.width * dpr; c.height = rect.height * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); });
        var sbRect = el.zoomScrollbar.getBoundingClientRect();
        el.sbCanvas.width = sbRect.width * dpr; el.sbCanvas.height = sbRect.height * dpr;
        el.sbCanvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        drawWaveform(); drawOverlay(); drawScrollbar();
    }
    function colors() {
        var s = getComputedStyle(document.documentElement);
        return { waveform: s.getPropertyValue('--waveform').trim(), selection: s.getPropertyValue('--selection').trim(), playhead: s.getPropertyValue('--playhead').trim(), border: s.getPropertyValue('--border').trim(), primary: s.getPropertyValue('--primary').trim(), textDim: s.getPropertyValue('--text-dim').trim(), surface: s.getPropertyValue('--surface').trim() };
    }
    function drawWaveform() {
        if (!state.waveformData) return;
        var c = el.wfCanvas, ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
        var w = c.width / dpr, h = c.height / dpr, data = state.waveformData, col = colors();
        ctx.clearRect(0, 0, w, h);
        var span = state.viewEnd - state.viewStart;
        if (span <= 0 || state.duration <= 0) return;
        var iStart = Math.floor((state.viewStart / state.duration) * data.length);
        var iEnd = Math.ceil((state.viewEnd / state.duration) * data.length);
        iStart = clamp(iStart, 0, data.length); iEnd = clamp(iEnd, 0, data.length);
        var visibleCount = iEnd - iStart;
        if (visibleCount <= 0) return;
        var barW = w / visibleCount, half = h / 2, amp = half * 0.88;
        ctx.fillStyle = col.waveform;
        for (var i = 0; i < visibleCount; i++) { var d = data[iStart + i]; ctx.fillRect(i * barW, half - d.max * amp, Math.max(1, barW - 0.3), Math.max(1, (half - d.min * amp) - (half - d.max * amp))); }
    }
    function drawOverlay() {
        var c = el.olCanvas, ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
        var w = c.width / dpr, h = c.height / dpr, col = colors();
        ctx.clearRect(0, 0, w, h);
        if (state.duration <= 0) return;
        if (state.loopStart !== null && state.loopEnd !== null) {
            var x1 = timeToX(state.loopStart, w), x2 = timeToX(state.loopEnd, w);
            ctx.fillStyle = col.selection; ctx.fillRect(x1, 0, x2 - x1, h);
        }
        var pos = getPos(), px = timeToX(pos, w);
        ctx.strokeStyle = col.playhead; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
        drawScrollbar();
    }
    function drawScrollbar() {
        var show = state.zoom > 1.01 && state.duration > 0;
        el.zoomScrollbar.style.display = show ? 'block' : 'none';
        if (!show || !state.waveformData) return;
    }

    function updatePitchShift() {
        if (!state.pitchShift) return;
        var speedComp = state.speed > 0 ? -12 * Math.log2(state.speed) : 0;
        state.pitchShift.pitch = speedComp + state.pitch;
    }
    async function doPlay() {
        await Tone.start();
        if (!state.player || state.isPlaying) return;
        var offset = state.currentPosition;
        if (state.loopEnabled && state.loopStart !== null && state.loopEnd !== null) {
            if (offset < state.loopStart || offset >= state.loopEnd) offset = state.loopStart;
        }
        state.player.loop = false;
        state.player.playbackRate = state.speed;
        updatePitchShift();
        var now = Tone.now();
        state.player.start(now, offset);
        state.playStartTime = now;
        state.playStartOffset = offset;
        state.isPlaying = true;
        el.playBtn.innerHTML = ICON_STOP;
        el.playBtn.classList.add('primary-fill');
        scheduleLoopEnd();
    }
    function doStop() {
        if (!state.player) return;
        cancelLoopTimer();
        state.currentPosition = getPos();
        state.player.stop();
        state.isPlaying = false;
        el.playBtn.innerHTML = ICON_PLAY;
        el.playBtn.classList.add('primary-fill');
        drawOverlay();
    }
    function seekTo(pos) {
        pos = clamp(pos, 0, state.duration); state.currentPosition = pos;
        if (state.isPlaying) { state.player.stop(); var now = Tone.now(); state.player.start(now, pos); state.playStartTime = now; state.playStartOffset = pos; scheduleLoopEnd(); }
        el.curTime.textContent = fmt(pos); drawOverlay();
    }
    function setSpeed(v) {
        if (state.isPlaying && state.player) {
            var now = Tone.now();
            var pos = state.playStartOffset + (now - state.playStartTime) * state.speed;
            state.playStartOffset = clamp(pos, 0, state.duration);
            state.playStartTime = now;
            state.speed = v; state.player.playbackRate = v;
        } else { state.speed = v; if (state.player) state.player.playbackRate = v; }
        updatePitchShift();
        el.speedVal.textContent = v.toFixed(2) + 'x'; updateSliderFill(el.speedSlider); scheduleLoopEnd();
    }
    function setPitch(v) {
        state.pitch = v;
        updatePitchShift();
        el.pitchVal.textContent = (v > 0 ? '+' : '') + v + ' st'; updateSliderFill(el.pitchSlider);
    }
    function cancelLoopTimer() { if (state.loopTimer) { clearTimeout(state.loopTimer); state.loopTimer = null; } }
    function restartAtLoopStart() {
        if (!state.isPlaying || !state.player) return;
        state.player.stop(); var now = Tone.now(); state.player.start(now, state.loopStart);
        state.playStartTime = now; state.playStartOffset = state.loopStart; scheduleLoopEnd();
    }
    function scheduleLoopEnd() {
        cancelLoopTimer();
        if (!state.isPlaying || !state.loopEnabled || state.loopStart === null || state.loopEnd === null) return;
        var remaining = state.loopEnd - state.playStartOffset;
        if (remaining <= 0) return;
        var ms = (remaining / state.speed) * 1000 - 80;
        if (ms < 0) ms = 0;
        state.loopTimer = setTimeout(restartAtLoopStart, ms);
    }
    function applyLoop() {
        if (!state.player || !state.isPlaying) return;
        cancelLoopTimer();
        if (state.loopEnabled && state.loopStart !== null && state.loopEnd !== null) {
            var rawPos = state.playStartOffset + (Tone.now() - state.playStartTime) * state.speed;
            if (rawPos < state.loopStart || rawPos >= state.loopEnd) {
                state.player.stop(); var now = Tone.now(); state.player.start(now, state.loopStart);
                state.playStartTime = now; state.playStartOffset = state.loopStart;
            }
            scheduleLoopEnd();
        }
    }
    function toggleLoop() {
        state.loopEnabled = !state.loopEnabled;
        el.loopBtn.classList.toggle('active', state.loopEnabled);
        if (!state.loopEnabled) { cancelLoopTimer(); state.loopStart = null; state.loopEnd = null; el.setA.classList.remove('active'); el.setB.classList.remove('active'); }
        else { applyLoop(); }
        updateLoopInfo(); drawOverlay();
    }
    function setA() {
        state.loopStart = getPos();
        if (state.loopEnd !== null && state.loopEnd <= state.loopStart) state.loopEnd = null;
        el.setA.classList.add('active');
        if (state.loopStart !== null && state.loopEnd !== null && !state.loopEnabled) { state.loopEnabled = true; el.loopBtn.classList.add('active'); }
        applyLoop(); updateLoopInfo(); drawOverlay();
    }
    function setB() {
        state.loopEnd = getPos();
        if (state.loopStart !== null && state.loopStart >= state.loopEnd) state.loopStart = null;

    mockPlayer.start = function () { started = true; };
    app.doPlay().then(function () {
        t('player.start called', function () { ok(started); });
        t('isPlaying true', function () { eq(state.isPlaying, true); });
        t('shows stop icon', function () { ok(el.playBtn.innerHTML.indexOf('rect') !== -1); });
        app.doStop();
        render();
        runPersistenceTests();
    });

    render();
    } // end continueOriginalTests

    function runPersistenceTests() {
        group('IndexedDB Persistence');

        app.clearSavedAudio().then(function () {
            t('clearSavedAudio resolves', function () { ok(true); });

            return app.getSavedAudio();
        }).then(function (result) {
            t('getSavedAudio returns null after clear', function () { eq(result, null); });

            var blob = new Blob(['fake-audio-data'], { type: 'audio/mpeg' });
            return app.saveAudioToDB(blob, 'test-song.mp3');
        }).then(function () {
            t('saveAudioToDB resolves', function () { ok(true); });

            return app.getSavedAudio();
        }).then(function (saved) {
            t('getSavedAudio returns saved data', function () { ok(saved !== null); });
            t('saved data has blob', function () { ok(saved.blob instanceof Blob); });
            t('saved data has correct fileName', function () { eq(saved.fileName, 'test-song.mp3'); });
            t('saved blob has correct type', function () { eq(saved.blob.type, 'audio/mpeg'); });

            return saved.blob.text().then(function (text) {
                t('saved blob has correct content', function () { eq(text, 'fake-audio-data'); });
            });
        }).then(function () {
            var blob2 = new Blob(['new-audio-data'], { type: 'audio/wav' });
            return app.saveAudioToDB(blob2, 'song2.wav').then(function () {
                return app.getSavedAudio();
            });
        }).then(function (saved) {
            t('overwrite replaces previous entry', function () { eq(saved.fileName, 'song2.wav'); });
            t('overwritten blob has new type', function () { eq(saved.blob.type, 'audio/wav'); });

            return app.clearSavedAudio();
        }).then(function () {
            return app.getSavedAudio();
        }).then(function (result) {
            t('clear removes the entry', function () { eq(result, null); });

            render();
        }).catch(function (err) {
            t('persistence tests threw: ' + err.message, function () { ok(false); });
            render();
        });
    }
})();
}, 0);
</script>
